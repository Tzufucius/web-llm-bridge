[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "web-llm-bridge"
version = "0.1.0"
description = "A local browser bridge for supported LLM web applications"
readme = "README.md"
requires-python = ">=3.9"
license = "AGPL-3.0-only"
authors = [{ name = "web-llm-bridge contributors" }]
dependencies = [
    "websockets>=14",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.scripts]
web-llm-bridge = "web_llm_bridge.cli.launcher:manual_main"
web-llm-agent = "web_llm_bridge.cli.launcher:agent_main"
web-llm-broker = "web_llm_bridge.broker.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["web_llm_bridge*"]

[tool.setuptools.package-data]
web_llm_bridge = ["_bundled_skills/**/*.md"]
